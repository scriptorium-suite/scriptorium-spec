name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      # (a) Release facts and producer-honesty policy (stdlib only).
      - name: Release consistency
        run: python tools/check_release_consistency.py

      # (b) Portable stdlib structural validator (no third-party deps). Must exit 0.
      - name: Structural validation (stdlib)
        run: python -c "from pathlib import Path; import subprocess, sys; raise SystemExit(subprocess.call([sys.executable, 'tools/validate.py', *map(str, sorted(Path('examples').glob('*.json')))]))"

      # (c) DEV/CI-only conformance + negative tests via the real jsonschema library.
      - name: Install locked dev/CI test dependencies
        run: uv sync --locked

      - name: Schema conformance + negative fixtures
        run: uv run --locked pytest tests/ -q -p no:cacheprovider
